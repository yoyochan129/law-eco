<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法律和金融研究动向 — Legal & Financial Research Trends</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-title">
      <h1>法律和金融研究动向</h1>
      <p class="subtitle">Legal & Financial Research Trends — Weekly Digest</p>
    </div>
    <div class="topbar-stats" id="topbarStats"></div>
  </div>
  <div class="tabbar">
    <button class="tab-btn active" data-tab="articles">研究文章</button>
    <button class="tab-btn" data-tab="news">每周新闻</button>
    <button class="tab-btn" data-tab="scholars">学者追踪</button>
  </div>
</header>

<div class="layout" id="mainLayout">
  <aside class="sidebar">
    <div class="sidebar-block">
      <input id="searchInput" type="text" placeholder="搜索标题 / 摘要 / 关键词…" class="search-input">
    </div>

    <div class="sidebar-block">
      <h3>周报</h3>
      <div id="weekList" class="filter-list"></div>
    </div>

    <div class="sidebar-block">
      <h3>数据来源</h3>
      <div id="sourceList" class="filter-list"></div>
    </div>

    <div class="sidebar-block" id="topicBlock">
      <h3>研究主题</h3>
      <div id="topicList" class="filter-list"></div>
    </div>

    <button id="resetBtn" class="reset-btn">↻ 重置筛选</button>
  </aside>

  <main class="content">
    <section class="trend-card" id="trendCard">
      <h2 id="trendTitle">本周研究趋势概括</h2>
      <div id="trendBody" class="trend-body"></div>
    </section>

    <section class="article-section" id="articleSection">
      <div class="article-section-header">
        <h2>文章列表</h2>
        <span id="resultCount" class="result-count"></span>
      </div>
      <div id="articleList" class="article-list"></div>
      <div id="emptyState" class="empty-state" style="display:none;">没有匹配的文章，试试调整筛选条件。</div>
    </section>

    <section class="article-section" id="newsSection" style="display:none;">
      <div class="article-section-header">
        <h2>新闻列表</h2>
        <span id="newsResultCount" class="result-count"></span>
      </div>
      <div id="newsList" class="article-list"></div>
      <div id="newsEmptyState" class="empty-state" style="display:none;">没有匹配的新闻，试试调整筛选条件。</div>
    </section>
  </main>
</div>

<div class="scholars-layout" id="scholarsLayout" style="display:none;">
  <aside class="scholars-sidebar">
    <input id="scholarSearchInput" type="text" placeholder="搜索学者姓名 / 研究领域…" class="search-input">
    <div class="scholar-group">
      <h3>法学学者</h3>
      <div id="lawScholarList" class="scholar-list"></div>
    </div>
    <div class="scholar-group">
      <h3>金融学者</h3>
      <div id="financeScholarList" class="scholar-list"></div>
    </div>
  </aside>
  <main class="scholars-detail" id="scholarsDetail">
    <div class="scholar-placeholder">从左侧选择一位学者查看详情</div>
  </main>
</div>

<script src="articles_data.js"></script>
<script src="news_data.js"></script>
<script src="scholars_data.js"></script>
<script src="app.js"></script>
</body>
</html>
