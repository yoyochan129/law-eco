name: 每周商业法律研究动向

on:
  schedule:
    # 每周一 01:00 UTC (北京时间 09:00)
    - cron: "0 1 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute report period
        id: period
        run: |
          echo "end=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "start=$(date -u -d '7 days ago' +%F)" >> "$GITHUB_OUTPUT"

      - name: Scrape sources
        run: python3 scripts/scrape.py

      - name: Build report (auto trend summary)
        run: |
          python3 scripts/build_report.py \
            --period-start ${{ steps.period.outputs.start }} \
            --period-end ${{ steps.period.outputs.end }}

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 周报 database docs
          git diff --cached --quiet && echo "无新文章,跳过提交" && exit 0
          git commit -m "周报自动更新: ${{ steps.period.outputs.end }}"
          git push
