name: 标签编辑后自动重建前端数据

on:
  push:
    branches: [main]
    paths:
      - "database/articles.json"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate docs/articles_data.js
        run: python3 scripts/regenerate_articles_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/articles_data.js
          git diff --cached --quiet && echo "无变化,跳过提交" && exit 0
          git commit -m "自动重建前端数据(标签编辑同步)"
          git push
